# Đường ống chiến dịch — BẢN MÔ TẢ MÁY ĐỌC ĐƯỢC
#
# Vì sao có file này: đường ống đang được mô tả ở BỐN chỗ — `pipeline_state.ORDER` (thứ tự),
# `worker.COMMANDS` (bước nào chạy lệnh nào), `approval_gate.GATES` (ba cổng), và văn xuôi trong
# tài liệu. Bốn chỗ thì sớm muộn chúng nói khác nhau, và agent đọc trúng chỗ nào thì theo
# chỗ đó.
#
# File này là bản mô tả để NGƯỜI và AGENT đọc; code vẫn là nơi thi hành. Chúng không được
# phép lệch nhau, và `tests/test_pipeline_spec.py` là cổng canh: đổi code mà quên đổi đây
# (hoặc ngược lại) thì test đỏ.
#
# ⚠️ Đây KHÔNG phải file cấu hình — sửa nó không đổi hành vi của bất kỳ script nào.

schema: pipeline/1
updated: '2026-09-12'

# ── Ba cổng người ───────────────────────────────────────────────────────────
# Mở cổng luôn đi qua `approval_gate.open_gate()`, bất kể mặt tiền nào. Hai mặt tiền ngang hàng:
#   · trong phiên (MẶC ĐỊNH) — `approval_gate.py`
#   · Telegram   (TUỲ CHỌN) — `approve_bus.py`
gate:
  g1:
    name: Cổng 1 — duyệt đề tài
    asks: Có làm bài này không, tiêu đề và góc nhìn đã đúng chưa
    stored_in: cột `g1` + `status=approved` trong bảng Content của campaign.md
    files_to_open: []          # chưa viết gì, chỉ có dòng trong bảng
    after: (chưa có bước nào)
    before: create-post
  g2:
    name: Cổng 2 — duyệt trước khi đăng
    asks: Bài này đăng được chưa, hay cần sửa gì
    stored_in: publish.json → posts[].review (+ ô `g2` mirror trong bảng)
    files_to_open: [content.md, gates.json, research.md]
    after: check-gates
    before: build-page
    blocked_when:      # fail-closed — không đem ra hỏi khi còn một trong ba
      - chưa viết
      - chưa chấm cổng nào (thiếu gates.json)
      - máy chấm ĐỎ
  g3:
    name: Cổng 3 — duyệt BẢN THẬT trên web
    asks: Mở link, xem bằng mắt, rồi mới cho phát ra kênh ngoài
    stored_in: cột `g3` trong bảng Content
    files_to_open: [atlas/atlas.html]
    needs_link: cột `web` — cổng này PHẢI chở link thật, gửi mã bài thì không có gì để mở
    after: build-page
    before: release
    enabled_by: khai cột `g3` trong bảng Content. Bảng không có cột đó thì không có cổng này.

# ── Mười trạng thái, theo đúng thứ tự ───────────────────────────────────────
# `loai: cong`  = dừng, chờ người.  `loai: buoc` = máy/agent chạy được.
# `lenh`        = lệnh `campaign_step.py <cam> <lenh> --post <mã>` mà thợ gọi.
# `artefact`    = thứ bước đó PHẢI sinh ra. Xong hay chưa hỏi cái này, KHÔNG hỏi mã thoát.
step:
  - id: await-G1
    kind: gate
    gate: g1

  - id: create-post
    kind: step
    cmd: null                # chạy cho cả chiến dịch, không theo từng bài
    does: tạo thư mục bài + meta.json + publish.json + khung content.md
    artefact: thư mục bài tồn tại

  - id: write
    kind: step
    cmd: [write]
    does: nghiên cứu và viết — research.md, content.md, tách kênh sang atlas/ facebook/ youtube/
    artefact: content.md có chữ thật
    hook: runtime.writer_cmd

  - id: check-gates
    kind: step
    cmd: ['__check_gates__']   # gọi thẳng blog_gates.py, không qua campaign_step
    does: chấm 23 cổng đếm được
    artefact: gates.json
    warning: blog_gates trả mã 1 khi kết luận ĐỎ — đó là KẾT QUẢ, không phải sự cố

  - id: fix-gates
    kind: step
    cmd: [write]              # cùng lệnh với `soan`; bước tự đọc phản hồi của người
    does: viết lại theo cổng đỏ và theo nhận xét
    artefact: content.md có chữ thật
    max_rewrites: 3               # quá số này thì dừng, hỏi người

  - id: await-G2
    kind: gate
    gate: g2

  - id: build-page
    kind: step
    cmd: [build-page]
    does: dựng atlas.html (+ audio nếu khai hook) rồi đăng web, ghi URL ngược vào cột `web`
    artefact: atlas/atlas.html
    hook: runtime.audio_cmd
    fail_closed:
      - dựng xong mà không ra atlas.html thì KHÔNG đem đi đăng
      - đăng xong mà không trả URL thì KHÔNG ghi cột web

  - id: await-G3
    kind: gate
    gate: g3

  - id: release
    kind: step
    cmd: [release]
    does: đăng YouTube và Facebook qua hook, ghi URL ngược vào bảng
    artefact: cột youtube hoặc facebook có URL
    hook: [runtime.youtube_cmd, runtime.facebook_cmd]
    fail_closed:
      - kênh nào hỏng thì KHÔNG đánh dấu bài đã phát hành

  - id: done
    kind: end

# ── Hai chế độ chạy ─────────────────────────────────────────────────────────
# Người chọn, không phải agent tự quyết. Cả hai đều đi qua đúng ba cổng trên.
run_modes:
  per_post:
    name: Từng bài, đi trọn đường ống
    use_when: bài quan trọng, hoặc đang dò xem quy trình chạy đúng chưa
    how: chạy `--post <mã>` cho một bài, dừng ở mỗi cổng và hỏi người ngay
    user_sees: một bài mỗi lần, kèm đường dẫn file để mở
  by_stage:
    name: Cả lô, duyệt theo từng cổng
    use_when: chạy đều nhiều bài, muốn ít lần bị ngắt
    how: chạy cùng một bước cho N bài, gom lại rồi hỏi người MỘT LẦN ở cổng
    user_sees: danh sách bài kèm đường dẫn file của từng bài
    default_count: 5        # người đổi được, kể cả "làm hết"

# ── Agent phải trả về gì sau mỗi bước ───────────────────────────────────────
# Bỏ mục nào trong đây thì người mất khả năng kiểm, và cổng thành con dấu cao su.
report_each_step:
  - bước vừa chạy và bài nào
  - artefact sinh ra, kèm ĐƯỜNG DẪN ĐẦY ĐỦ để mở ngay
  - kết quả chấm cổng nếu bước đó có chấm (xanh mấy, đỏ mấy, đỏ ở đâu)
  - bước kế tiếp mà `status` suy ra
  - nếu tới cổng — câu hỏi cần người trả lời, và danh sách file phải đọc trước khi trả lời

# ── Nơi giữ trạng thái ──────────────────────────────────────────────────────
state_lives_in:
  content_table: campaign.md giữa hai mốc CONTENT:BEGIN / CONTENT:END — bảng ĐIỀU PHỐI
  publish_json: <thư mục bài>/publish.json — dấu vết duyệt Cổng 2 và link từng kênh
  event_log: logs/events.jsonl — chỉ nối thêm, trả lời "vì sao bài tới trạng thái này"
  work_queue: logs/jobs/{cho,running,xong,hong}/ — thư mục LÀ trạng thái
  feedback: logs/feedback.json — nhận xét của người, vòng viết lại đọc chỗ này
  not_a_source: chiến dịch cũ còn file .xlsx — đó là BẢN XUẤT, không phải nguồn
