# Bộ test trên hai hệ điều hành: Windows (PowerShell 5.1 — máy lịch hôm nay) và macOS
# (pwsh 7 — máy lịch sau khi dời). Chỉ chạy `pytest`; không build, không deploy, không secret.
#
# Vì sao macOS phải có pwsh THẬT: ba file test `.ps1` tự skip khi thiếu PowerShell, và trên CI
# "skip" trông y hệt "xanh". `MARKETING_STUDIO_REQUIRE_POWERSHELL=1` bảo `tests/conftest.py`
# dừng cả lượt nếu không thấy `powershell`/`pwsh`. Cấu hình này được giữ bởi
# `tests/test_ci_workflow.py`.
name: tests

# Chạy trên MỌI nhánh, không riêng `main`: công việc thật sống trên nhánh feature, và một CI
# chỉ nhìn `main` thì tới lúc merge mới biết đỏ — quá muộn để còn là cổng.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu: job chỉ đọc mã, không ghi gì lên GitHub.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # 3.10 là sàn khai trong pyproject.toml (`requires-python`); 3.12 là bản máy lịch
        # đang chạy và bản INSTALL.md bảo cài trên Mac; 3.13 giữ cho repo không vỡ âm thầm
        # khi người mới cài Python mới nhất.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      # Ghim SHA (kèm tag để đọc): tag có thể bị dời, SHA thì không.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: PowerShell 7 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Windows PowerShell 5.1 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Cài phụ thuộc
        run: python -m pip install -r requirements.txt

      - name: pytest
        env:
          MARKETING_STUDIO_REQUIRE_POWERSHELL: "1"
        run: python -m pytest -q -rs

  # Cổng P1-8 (30/09/2026): bộ test phải xanh trên MÁY ĐÃ CÀI, không chỉ trên checkout sạch.
  # Job trên chạy trên cây vừa checkout — không có `workspace/`, không `studio.local.json`,
  # không `.env`. Mọi máy chạy thật thì đã `install … embedded`, và 12 test từng đọc trạng
  # thái THẬT đó của repo: xanh ở đây, đỏ trên Mac mini. Job này cài đúng như người dùng rồi
  # chạy `pytest` TRẦN (không `tests/`) — cũng bắt luôn việc gom nhầm test trong `workspace/`.
  # Một bản Python (bản máy lịch đang chạy) là đủ: ma trận Python đã có ở job trên.
  pytest-embedded:
    name: cài embedded rồi pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: PowerShell 7 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Cài phụ thuộc
        run: python -m pip install -r requirements.txt

      - name: Cài embedded (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: sh ./install.sh --mode embedded

      - name: Cài embedded (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 -Mode embedded

      # Cổng P1-18: máy chạy thật có `<repo>/.env` điền con trỏ và `~/.secret/**` có thật. Test
      # nào lọt ra đọc chúng (kể cả qua tiến trình con) thì đỏ ở đây — trên CI chỉ là file GIẢ
      # (token giả, gửi thử cũng chỉ nhận 401), trên máy người dùng là secret thật.
      - name: Máy như máy thật — .env + kho secret GIẢ
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          nha = pathlib.Path.home() / ".secret"
          cfg = nha / "telegram" / "config.json"
          cfg.parent.mkdir(parents=True, exist_ok=True)
          cfg.write_text(json.dumps({"bot_token": "000000:CI-GIA",
                                     "chats": {"mac_dinh": {"chat_id": 1}}}), encoding="utf-8")
          dong = {"TG_CONFIG": cfg}
          for ten in ("YT_TOKEN_PATH", "YT_CLIENT_SECRET", "FB_CONFIG", "EMAIL_CONFIG",
                      "YT_TOKEN_PATH__NGHE_TIEN_TRUYEN", "YT_CLIENT_SECRET__NGHE_TIEN_TRUYEN"):
              f = nha / "ci-gia" / (ten.lower() + ".json")
              f.parent.mkdir(parents=True, exist_ok=True)
              f.write_text("{}", encoding="utf-8")
              dong[ten] = f
          pathlib.Path(".env").write_text(
              "".join(f"{k}={v.as_posix()}\n" for k, v in dong.items()), encoding="utf-8")
          PY

      - name: pytest trần sau khi cài
        env:
          MARKETING_STUDIO_REQUIRE_POWERSHELL: "1"
        run: python -m pytest -q -rs
