    draft:
      title: Đọc hóa đơn điện bắt đầu từ đâu?
      body: 'Khi tổng tiền điện thay đổi, hãy kiểm tra kỳ ghi chỉ số, lượng điện tiêu thụ và các bậc tính trên hóa đơn trước
