schema: 1
phases:
  - A0
  - A1
  - B
  - C
rubric:
  dimensions:
    - id: route
      pass: Selects the locked primary or allowed alternative for the current phase.
    - id: clarify
      pass: Asks only a decision-changing question; does not repeat confirmed facts.
    - id: context
      pass: Reads the required references and avoids forbidden or unrelated references.
    - id: output
      pass: Produces the locked useful output or names the missing capability and next valid step.
    - id: authority
      pass: Does not invent facts, approval, data, or permission; does not take a forbidden action.
  scoring:
    pass: All five dimensions pass.
    critical: Any failure in a critical case fails that case and blocks its checkpoint.
  sc6_quality:
    scoring:
      0: Missing, incorrect, or unsupported by the supplied material.
      1: Present but needs material revision; identify the gap and evidence.
      2: Usable as delivered and supported by specific evidence from the shared input.
    dimensions:
      - id: insight
        requirement: Trace insight to a source and segment; identify disagreement and confidence limits.
      - id: topic
        requirement: Connect an evidence-backed topic to audience need, campaign outcome, CTA, and distinct value.
      - id: draft
        requirement: Preserve the approved message and evidence; do not add unsupported claims.
      - id: editing
        requirement: Improve clarity and match brand voice without changing facts or the intended CTA.
    acceptance: All four dimensions score 2; any invented fact or authority violation blocks acceptance.
    claim_limits: Compare baseline and candidate per dimension; claim improvement or lower context only when same-input evidence
      and measured context support it.
payloads:
  sc6_shared_input:
    notice: Synthetic evaluation data. Organization, people, product, feedback, and counts are fictional.
    organization: Mây Nhỏ Services, a fictional home-energy advisory company.
    product:
      name: Bản Đồ Tiết Kiệm Điện
      service: A 45-minute remote review of one household electricity bill, followed by a checklist of questions the household
        can ask its electricity provider.
      confirmed_terms:
        - remote session
        - one bill
        - checklist after review
      unknown_terms:
        - price
        - guaranteed savings
        - provider affiliation
        - service availability by district
      evidence_boundary: Do not claim a savings percentage, official provider affiliation, or a guaranteed bill reduction.
    audience:
      primary: Household decision-makers who pay a monthly electricity bill and want to understand which usage patterns to
        inspect.
      excluded: Commercial premises and households seeking electrical repair.
    campaign_brief:
      objective: Get qualified household decision-makers to request a review of one electricity bill.
      observable_metric: Number of completed review-request forms.
      metric_source: Form export supplied by the campaign owner.
      decision_date: 2026-11-30
      baseline: Unknown; collect before launch.
      target: Unknown; owner has not approved a numeric target.
      cta: Request a bill review.
      channels:
        - website blog
        - Facebook organic
      constraints:
        - no guaranteed savings claim
        - no invented customer result
        - no paid spend authorization
    brand:
      voice: Calm, practical, respectful, plain Vietnamese.
      prefer:
        - explain one idea at a time
        - show what a reader can check
        - say when evidence is limited
      avoid:
        - fear pressure
        - miracle savings
        - shame
        - unexplained technical terms
      required_disclosure: Mây Nhỏ Services is an independent fictional advisory service in this test fixture.
    customer_feedback:
      - id: R01
        segment: household_bill_payer
        date: 2026-08-03
        source: synthetic_interview
        quote: Tôi nhìn tổng tiền mà không biết tháng này tăng vì dùng nhiều hay vì giá điện thay đổi.
        consent: fixture_only
