        source: synthetic_interview
        quote: Tôi cần xem chi phí điện của cửa hàng theo ca bán hàng.
        consent: fixture_only
    search_observations:
      source: Supplied synthetic keyword worksheet; not a live search-volume report.
      rows:
        - query: cách đọc hóa đơn điện sinh hoạt
          intent: informational
          observations: 12
        - query: hóa đơn điện tăng phải kiểm tra gì
          intent: troubleshooting
          observations: 8
        - query: sửa điện tại nhà
          intent: service
          observations: 3
    source_facts:
      - id: F01
        fact: The supplied sample feedback includes four household bill-payer comments
        one renter comment: null
        and one shop-owner comment.: null
        source_ids:
          - R01
          - R02
          - R03
          - R04
          - R05
          - R06
      - id: F02
        fact: The feedback contains both confusion about bill changes and disagreement about whether changing appliance-use
          time changes a bill.
        source_ids:
