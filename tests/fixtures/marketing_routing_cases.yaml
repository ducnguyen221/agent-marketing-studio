        segment: renter
        date: 2026-08-07
        source: synthetic_survey
        quote: Tôi không kiểm soát được thiết bị trong nhà thuê nên lời khuyên thay máy không phù hợp.
        consent: fixture_only
      - id: R04
        segment: household_bill_payer
